<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🖤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000000;
      --card-bg: rgba(18, 18, 20, 0.78);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f5f5f7;
      --text-muted: #888890;
      --accent: #ffffff;
      --highlight: #e0e0e0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(40, 40, 55, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(20, 20, 25, 0.3) 0%, transparent 70%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
    }

    /* Ambient background stars & particles */
    .stars-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star-particle {
      position: absolute;
      color: rgba(255, 255, 255, 0.55);
      font-size: 1rem;
      opacity: 0;
      animation: floatUp 8s ease-in infinite;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
    }

    @keyframes floatUp {
      0%   { transform: translateY(105vh) scale(0.6) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.65; }
      85%  { opacity: 0.65; }
      100% { transform: translateY(-10vh) scale(1) rotate(45deg); opacity: 0; }
    }

    /* Top Moon element */
    .moon-header {
      position: absolute;
      top: 6vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      opacity: 0.9;
    }

    .moon-icon {
      font-size: 2.2rem;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.45));
      animation: moonGlow 4s ease-in-out infinite alternate;
    }

    @keyframes moonGlow {
      from { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35)); }
      to   { transform: scale(1.05); filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.6)); }
    }

    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px 80px;
      gap: 32px;
    }

    .text-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 42px 32px;
      width: min(440px, 90vw);
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      border: 1px solid var(--card-border);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(255, 255, 255, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .main-text {
      font-weight: 700;
      font-size: clamp(1.45rem, 5.8vw, 2.15rem);
      color: var(--text-main);
      line-height: 1.42;
      letter-spacing: -0.015em;
      white-space: pre-line;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .main-text.highlight {
      color: #ffffff;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.7rem, 6.6vw, 2.45rem);
      letter-spacing: 0.01em;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      60% {
        transform: translateY(-2px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .pop {
      animation: popIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Progress indicators */
    .progress {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      max-width: 90vw;
      flex-wrap: wrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      transition: all 0.35s ease;
    }

    .dot.active {
      width: 22px;
      border-radius: 99px;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    .dot.done {
      background: rgba(255, 255, 255, 0.45);
    }

    /* Bottom Hint */
    .hint {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 20px 20px 24px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      z-index: 10;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 50%, transparent);
      pointer-events: none;
    }

    .hint-dots {
      display: inline-block;
      margin: 0 4px;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50%      { opacity: 0.25; transform: scale(0.85); }
    }

    /* Water Ripple Effect */
    .ripple {
      position: fixed;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 80%);
      transform: translate(-50%, -50%) scale(0);
      animation: rippleOut 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(5.5); opacity: 0; }
    }

    /* Sparkle burst at completion */
    .sparkle {
      position: fixed;
      font-size: 1.4rem;
      animation: sparkleAnim 1s ease-out forwards;
      pointer-events: none;
      z-index: 200;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
    }

    @keyframes sparkleAnim {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -180%) scale(1.4) rotate(45deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Ambient star particles container -->
  <div class="stars-bg" id="starsBg"></div>

  <!-- Top Moon Symbol (matches the reference screenshot) -->
  <div class="moon-header">
    <div class="moon-icon">🌕</div>
  </div>

  <div class="scene" id="scene">
    <div class="text-card" id="card">
      <div class="main-text" id="mainText">tan</div>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="hint">
    <span class="hint-dots">✦</span>
    sentuh dimana saja untuk melanjutkan
    <span class="hint-dots">✦</span>
  </div>

  <script>
    const slides = [
      { text: "404 Not Found",                                           highlight: false },
      // { text: "will u be my girl ?",                           highlight: false  },
      // { text: "tapi aku gamau kamu jawab sekarang",             highlight: false },
      // { text: "aku pengen kita saling kenal dulu",             highlight: false },
      // { text: "tau kekurangan masing-masing",                  highlight: false },
      // { text: "untuk aku sendiri.....",                        highlight: false },
      // { text: "aku laki-laki yg masih berproses",              highlight: false },
      // { text: "kadang ada duitnya kadang ngga ada",            highlight: false },
      // { text: "aku juga lagi mengusahakan kehidupan yang lebih baik", highlight: false },
      // { text: "but i want you",                                highlight: false  },
      // { text: "to be part of my struggle for a better life",   highlight: false },
      // { text: "sambil jalan, mungkin kita bisa saling bantu",  highlight: false },
      // { text: "we'll rise above and beyond",                   highlight: false  },
      // { text: "what do you think ?",                           highlight: false  }
    ];

    let current             = 0;
    let isAnimating         = false;
    let fullscreenTriggered = false;

    const mainText   = document.getElementById('mainText');
    const textCard   = document.getElementById('card');
    const progressEl = document.getElementById('progress');
    const scene      = document.getElementById('scene');

    function buildDots() {
      progressEl.innerHTML = '';
      slides.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === current ? ' active' : i < current ? ' done' : '');
        progressEl.appendChild(d);
      });
    }

    function spawnStar() {
      const bg = document.getElementById('starsBg');
      const star = document.createElement('div');
      star.className = 'star-particle';
      const symbols = ['✦', '✧', '⋆', '•', '✨', '🤍'];
      star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      star.style.left = (Math.random() * 96 + 2) + 'vw';
      star.style.animationDuration = (6 + Math.random() * 4) + 's';
      star.style.fontSize = (0.7 + Math.random() * 0.7) + 'rem';
      bg.appendChild(star);
      setTimeout(() => star.remove(), 10000);
    }

    // Spawn initial stars and continue periodically
    for (let i = 0; i < 7; i++) {
      setTimeout(spawnStar, i * 600);
    }
    setInterval(spawnStar, 1200);

    function addRipple(x, y) {
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = x + 'px';
      r.style.top  = y + 'px';
      document.body.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    }

    function burstSparkles(x, y) {
      const icons = ['✨', '🤍', '🌙', '✦', '✧', '⭐'];
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('div');
        s.className   = 'sparkle';
        s.textContent = icons[Math.floor(Math.random() * icons.length)];
        s.style.left  = (x + (Math.random() - 0.5) * 140) + 'px';
        s.style.top   = (y + (Math.random() - 0.5) * 100) + 'px';
        s.style.animationDelay = (i * 0.05) + 's';
        document.body.appendChild(s);
        s.addEventListener('animationend', () => s.remove());
      }
    }

    function goFullscreen() {
      const el  = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen
                || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) {
        req.call(el).catch(() => {});
      }
    }

    function setSlide(index) {
      const slide = slides[index];

      mainText.classList.remove('pop', 'highlight');
      void mainText.offsetWidth; // force reflow

      mainText.textContent = slide.text;
      if (slide.highlight) {
        mainText.classList.add('highlight');
      }
      mainText.classList.add('pop');

      textCard.style.transform = 'scale(0.97)';
      setTimeout(() => {
        textCard.style.transform = 'scale(1)';
      }, 100);

      buildDots();
    }

    let lastInteraction = 0;
    function handleInteraction(clientX, clientY) {
      const now = Date.now();
      if (now - lastInteraction < 280 || isAnimating) return;
      lastInteraction = now;

      const x = clientX ?? window.innerWidth  / 2;
      const y = clientY ?? window.innerHeight / 2;

      addRipple(x, y);

      if (current === 0 && !fullscreenTriggered) {
        fullscreenTriggered = true;
        goFullscreen();
      }

      if (current < slides.length - 1) {
        isAnimating = true;
        current++;
        setSlide(current);
        if (current === slides.length - 1) {
          setTimeout(() => burstSparkles(x, y), 250);
        }
        setTimeout(() => { isAnimating = false; }, 350);
      } else {
        burstSparkles(x, y);
      }
    }

    window.addEventListener('click', (e) => {
      handleInteraction(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) {
        handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Initial setup
    setSlide(0);
  </script>
</body>
</html>
